services:
  artforge:
    build:
      context: .
      target: development
    container_name: artforge-dev
    ports:
      - "8003:8003"
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./static:/app/static
    environment:
      - PYTHONPATH=/app/src
      - DATABASE_URL=sqlite:///./data/art_forge.db
      - UPLOAD_DIR=/app/data/uploads
      - DEBUG=true
    restart: unless-stopped
    networks:
      - artforge-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: SQLite browser for database inspection
  sqlite-browser:
    image: coleifer/sqlite-web
    container_name: artforge-sqlite-browser
    ports:
      - "8084:8080"
    volumes:
      - ./data:/data
    command: ["sqlite_web", "/data/art_forge.db", "--host", "0.0.0.0", "--port", "8080"]
    networks:
      - artforge-network
    profiles:
      - tools

networks:
  artforge-network:
    driver: bridge
