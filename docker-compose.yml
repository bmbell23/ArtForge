services:
  artforge:
    build:
      context: .
      target: development
    container_name: artforge
    ports:
      - "8003:8003"
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./static:/app/static
    environment:
      - PYTHONPATH=/app/src
      - DATABASE_URL=sqlite:///./data/art_forge.db
      - UPLOAD_DIR=/app/data/uploads
    restart: unless-stopped
    networks:
      - artforge-network
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8003/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

networks:
  artforge-network:
    driver: bridge
